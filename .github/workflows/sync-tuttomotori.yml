name: Sync portfolio and publish

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify synchronization logic
        run: node --test scripts/*.test.mjs
      - name: Update channel archives
        id: feed
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-channels.mjs
      - name: Complete single videos
        id: videos
        continue-on-error: true
        run: node scripts/sync-videos.mjs
      - name: Update YouTube views
        id: views
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-views.mjs
      - name: Build static portfolio
        run: |
          node scripts/build.mjs
          node scripts/check.mjs
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data img/youtube index.html projects en privacy.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update portfolio data and pages"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report incomplete synchronization
        if: steps.feed.outcome == 'failure' || steps.videos.outcome == 'failure' || steps.views.outcome == 'failure'
        run: |
          echo "::error::Website published with last valid data. Inspect failed synchronization steps."
          exit 1

<style>
.missing{min-height:calc(100svh - 160px);display:grid;align-content:center;gap:28px;padding-block:64px}
.missing-code{font-family:var(--display);font-weight:800;font-size:clamp(7rem,26vw,22rem);line-height:.8;letter-spacing:-.02em}
.missing-track{position:relative;display:flex;gap:3px;height:44px;max-width:720px}
.missing-track span{flex:1;background:var(--surface)}
.missing-track span:nth-child(3){background:none;outline:1px dashed var(--muted);outline-offset:-1px}
.missing-track::after{content:"";position:absolute;top:-8px;bottom:-8px;left:50%;width:3px;background:var(--accent)}
.missing h1{font-size:clamp(2.6rem,6vw,5.6rem)}
.missing p{max-width:52ch;color:var(--muted)}
.missing-links{display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px}
.missing-links a:not(.button){text-decoration:underline;text-underline-offset:3px}
</style>
</head><body>
